######################################################################
# DinaPlayer — mpv.conf
######################################################################

## --- Video output & performance ---
vo=gpu-next
hwdec=auto-safe
hr-seek=yes                 # precise (frame-accurate) seeking, YouTube-like
# Read further ahead so "jump to next subtitle" (, and .) can see upcoming lines.
# With mpv's 1s default it overshoots or does nothing; capped by demuxer-max-bytes.
demuxer-readahead-secs=60
cursor-autohide=2500        # hide cursor (and, via uosc autohide, the UI) after 2.5s idle

## --- Audio ---
# Volume is set from uosc's vertical volume slider (shown on the left with the
# rest of the UI — see volume= in uosc.conf) and remembered globally by
# scripts/volume-memory.lua. Range is capped at 100 (no boost). Keyboard/wheel
# volume stays disabled (see input.conf) — the slider is the only control.
# volume=100 is just the first-run default; volume-memory.lua overrides it with
# the saved value on startup.
volume=100
volume-max=100
# media-controls=no → don't register with Windows' System Media Transport Controls
# (the "now playing" flyout / lock-screen controls). A Bluetooth speaker/headset —
# or a phone routed through one — sends a "stop" through that session that would
# UNLOAD the video mid-playback (even while paused). Opting out fixes it.
media-controls=no

## --- Resume playback & remember tracks (per file) ---
# Saving is handled by scripts/resume-on-nav.lua (on file unload), so it also
# works when switching episodes, and a finished file gets no stale resume point
# at its end. Keep this off or the two would fight.
save-position-on-quit=no
# What to store in the watch-later file. MUST include 'start' (position).
watch-later-options=start,vid,aid,sid,secondary-sid,sub-delay,audio-delay,sub-visibility,secondary-sub-visibility,speed

## --- External audio / subtitle files ---
# Handled by scripts/external-tracks.lua so the tracks get readable names;
# mpv's own auto-loading stays off to avoid adding each file twice.
audio-file-auto=no
sub-auto=no

## --- Track language preferences (whole-series default) ---
alang=jpn,eng,rus
slang=rus,eng

## --- End-of-file / playlist behavior ---
keep-open=yes               # stay open (paused) at end of the whole playlist
# Stay open when started without a file, so launching DinaPlayer.exe on its own
# shows the player (scripts/last-session.lua then reopens what you watched last).
idle=yes

## --- Subtitles ---
# These are mpv's own defaults, written out rather than left implicit: a side by
# side comparison against a stock mpv build showed its subtitles read better than
# our Inter-based styling, mostly because of the heavier outline (1.65 against
# our 1.0). Keeping the values here means we can see and tune them.
sub-font=sans-serif
sub-font-size=38
sub-color="#FFFFFFFF"
sub-outline-size=1.65
sub-outline-color="#FF000000"
# No drop shadow: the outline is what carries legibility on bright frames, and a
# shadow on top only made the text look embossed.
sub-shadow-offset=0
sub-margin-y=34
# Embedded ASS/SSA subtitles (typical for anime) keep their author's styling, so
# positioned signs and karaoke don't break — mpv's default `scale` behaviour.

## --- UI font ---
# Inter is bundled in portable_config/fonts/Inter.ttf; uosc reads its text font
# from osd-font, so this styles the whole player UI (timecodes, titles, menus).
osd-font=Inter

## --- UI: disable built-in OSC/OSD bar; uosc replaces them (Task 6) ---
osc=no
osd-bar=no
border=no                   # borderless window; uosc draws its own controls
# Fullscreen-on-start is controlled by scripts/fullscreen-on-start.lua (toggle in
# the Settings menu, on by default) — not hardcoded here.
