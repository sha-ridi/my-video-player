# DinaPlayer — autoload. Video-only player: the playlist is built ONLY from
# video files. Audio-only files in the folder (e.g. external .ac3/.mp3 dubs)
# and images must never become playlist entries.
disabled=no
videos=yes
audio=no
images=no
ignore_hidden=yes
# Build the playlist only from files of the same type as the opened one.
same_type=no
# Never scan or add subfolders/sibling folders — the playlist is only the video
# files in the CURRENT folder, nothing else (no folder entries, no recursion).
directory_mode=ignore
