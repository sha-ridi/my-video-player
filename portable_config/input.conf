######################################################################
# DinaPlayer — input.conf (YouTube-style)
######################################################################

## ============ ACTIVE ============

## Seeking — via seek-indicator.lua (the "+N sec »" pill)
RIGHT        script-message dina-seek  5
LEFT         script-message dina-seek -5
l            script-message dina-seek  10
j            script-message dina-seek -10
L            script-message dina-seek  10   # l with CapsLock on
J            script-message dina-seek -10   # j with CapsLock on
Shift+RIGHT  script-message dina-seek  30
Shift+LEFT   script-message dina-seek -30

## Fullscreen / play-pause
f             cycle fullscreen
F             cycle fullscreen              # f with CapsLock on
MBTN_LEFT_DBL cycle fullscreen
k             cycle pause         # Space also pauses (mpv default)
K             cycle pause                   # k with CapsLock on
## Right-click does nothing (no context menu popup).
MBTN_RIGHT    ignore

## Subtitle seek on , and . — jump to the previous / next subtitle line, so the
## text on screen follows. Which track it follows (primary/secondary) is a
## Settings toggle; see scripts/sub-seek.lua. Russian layout: , and . emit б, ю.
,            script-message dina-sub-seek -1   # previous line
.            script-message dina-sub-seek  1   # next line
б            script-message dina-sub-seek -1   # , on Russian layout
ю            script-message dina-sub-seek  1   # . on Russian layout
Б            script-message dina-sub-seek -1   # б with CapsLock on
Ю            script-message dina-sub-seek  1   # ю with CapsLock on

## Russian layout (ЙЦУКЕН) duplicates for the active keys above.
о            script-message dina-seek -10   # j
д            script-message dina-seek  10   # l
л            cycle pause                    # k
а            cycle fullscreen               # f
## Same four, with CapsLock on (uppercase forms).
О            script-message dina-seek -10   # j
Д            script-message dina-seek  10   # l
Л            cycle pause                    # k
А            cycle fullscreen               # f

